{% set name = "formulate" %}
{% set version = "1.1.0" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/formulate-{{ version }}.tar.gz
  sha256: c08152cbf155e4d4548a062c63d18317f6ea00451159dabb164ca28b82ca47d1

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >={{ python_min }}
    - typing_extensions >=3.10
    - hepunits
    - lark >=1.3
    - ordered-set

test:
  imports:
    - formulate
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/Scikit-HEP/formulate
  summary: Easy conversions between different styles of expressions
  description: |
    Formulate provides easy conversions between different styles of expressions.
    It currently supports converting between ROOT and numexpr style expressions.
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ariostas
    - jonas-eschle
